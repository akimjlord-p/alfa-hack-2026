<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><style>text{font-family:Arial,sans-serif;fill:#183128}.s{fill:#fff;stroke:#0d6045;stroke-width:2}.t{font-size:15px;font-weight:700}.sm{font-size:12px}.a{stroke:#0d6045;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#0d6045"/></marker></defs><rect width="1100" height="330" fill="#f4f7f4"/><text x="32" y="38" class="t">Жизненный цикл демо-заявки</text><rect x="45" y="105" width="145" height="68" rx="12" class="s"/><text x="68" y="135" class="t">submitted</text><text x="68" y="155" class="sm">Отправлена</text><rect x="265" y="105" width="155" height="68" rx="12" class="s"/><text x="288" y="135" class="t">under_review</text><text x="288" y="155" class="sm">На рассмотрении</text><rect x="495" y="45" width="150" height="68" rx="12" class="s"/><text x="518" y="75" class="t">needs_info</text><text x="518" y="95" class="sm">Нужны уточнения</text><rect x="495" y="180" width="150" height="68" rx="12" class="s"/><text x="526" y="210" class="t">approved</text><text x="526" y="230" class="sm">Одобрена в демо</text><rect x="730" y="180" width="150" height="68" rx="12" class="s"/><text x="766" y="210" class="t">rejected</text><text x="766" y="230" class="sm">Отклонена в демо</text><path d="M190 139 H265" class="a"/><path d="M420 120 L495 86" class="a"/><path d="M420 158 L495 213" class="a"/><path d="M645 214 H730" class="a"/><path d="M570 113 V180" class="a"/><path d="M570 180 V113" class="a"/><text x="48" y="292" class="sm">Предприниматель может дать уточнение: needs_info → submitted → under_review.</text></svg>
