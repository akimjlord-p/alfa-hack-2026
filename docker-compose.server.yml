services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: credit_navigator
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit_navigator"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    environment:
      DATABASE_URL: postgresql+psycopg://credit:${POSTGRES_PASSWORD}@db:5432/credit_navigator
      YANDEX_API_KEY: ${YANDEX_API_KEY:?set YANDEX_API_KEY}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:?set YANDEX_FOLDER_ID}
      YANDEX_MODEL: ${YANDEX_MODEL:-aliceai-llm-flash}
    ports:
      - "127.0.0.1:8088:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://credit:${POSTGRES_PASSWORD}@db:5432/credit_navigator
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
